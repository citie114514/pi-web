name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      # The job log needs authentication to read, so the failing test names are
      # copied into the run summary and emitted as annotations.
      - if: always()
        run: |
          {
            echo '## npm test'
            echo '```'
            grep -E '^(not ok|# (tests|pass|fail))' test-output.log | head -80 || echo 'no failures'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: grep -E '^not ok' test-output.log | head -10 | sed 's/^/::error::/' || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/e2e/
          retention-days: 7
