<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'" />
    <title>WebPi</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
        color: #e8e8e8;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
        user-select: none;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 20px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: #9a9a9a;
        font-size: 13px;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 2px solid #3a3a3a;
        border-top-color: #7aa2f7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../public/icons/icon-192.png" alt="" />
      <h1>WebPi</h1>
      <div class="spinner"></div>
      <p>正在启动本地服务…</p>
    </main>
  </body>
</html>
